name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -P scripts scripts/*.sh tests/run.sh
      - name: unit tests
        run: tests/run.sh

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: seed an entry
        run: |
          mkdir -p .changelog
          printf 'semver: patch\ntype: Fixed\nSelf-test entry\n' > .changelog/self-test.md
      - id: run
        uses: ./
        with:
          mode: release
          dry-run: 'true'
          release-date: '2026-01-01'
      - name: check outputs
        run: |
          test "${{ steps.run.outputs.has-changes }}" = "true"
          test "${{ steps.run.outputs.bump }}" = "patch"
          test -n "${{ steps.run.outputs.version }}"
          grep -q "Self-test entry" CHANGELOG.md
          grep -q "^### Fixed" CHANGELOG.md
          echo "resolved ${{ steps.run.outputs.previous-version }} -> ${{ steps.run.outputs.version }}"

      # An entry with no semver header must stop the run, not release quietly.
      - name: seed a headerless entry
        run: |
          git checkout -- CHANGELOG.md
          mkdir -p .changelog
          echo "No header here" > .changelog/headerless.md
      - id: bad
        continue-on-error: true
        uses: ./
        with:
          mode: release
          dry-run: 'true'
      - name: the headerless entry should have failed the step
        run: test "${{ steps.bad.outcome }}" = "failure"
