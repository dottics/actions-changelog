# .github/workflows/release-pr.yml
#
# Runs after a PR lands on main. If any .changelog entries are waiting, it
# opens (or refreshes) a "chore(release): vX.Y.Z" PR that writes the changelog
# section and clears the entries.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-bump:
        description: Override the bump level
        required: false
        type: choice
        options: ['', patch, minor, major]
        default: ''

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the action can find the latest release tag.
          fetch-depth: 0
          fetch-tags: true

      - id: changelog
        uses: your-org/changelog-action@v1
        with:
          mode: release
          entry-dir: .changelog
          changelog-file: CHANGELOG.md
          # version-file: VERSION      # uncomment to keep a VERSION file in sync
          tag-prefix: v
          base-branch: main
          pr-labels: release,automated
          force-bump: ${{ inputs.force-bump }}
          # A PR opened with the default GITHUB_TOKEN will NOT trigger other
          # workflows. Swap in a PAT or GitHub App token if the release PR
          # needs to run CI.
          # token: ${{ secrets.RELEASE_PAT }}

      - if: steps.changelog.outputs.has-changes == 'true'
        run: echo "Prepared ${{ steps.changelog.outputs.tag }} → ${{ steps.changelog.outputs.pull-request-url }}"
